packages:
  - 'apps/*'
  - 'games/*'
  - 'packages/*'

# esbuild ships its binary as an optional platform package; its postinstall
# only validates that binary. Approved so `pnpm install` stays non-interactive.
allowBuilds:
  esbuild: true
  # workerd is the Workers runtime wrangler runs locally; its postinstall only
  # unpacks the platform binary. Needed for `wrangler pages dev`, which is how
  # the production build is checked before a deploy.
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260907.0-alpha
  - wrangler@4.129.1
